  /ops/reports/{id}/investigate:
    post:
      operationId: investigateReport
      tags:
      - Operations
      description: 'Operator-only bounded read-only investigation of this root report. Model may read the case,
        search bounded related reports, look up a reference supported by a permitted source and read access events
        for an evidenced batch. Existing related_reports output remains; optional dossier adds source-linked findings,
        counter-evidence/unresolved points, recommended checks and sanitized completed activity. Shared bounds:
        20 seconds, at most three model requests and four tools. Exact replay uses the original source snapshot
        and makes no new provider call. All restrictions/holds/notices require separate authenticated human actions.
        This endpoint is synchronous and has no stream; a persisted failure/timeout contains safe partial results
        and never claims successful completion. Initial context contains a bounded permitted root excerpt/source
        handle. On PENDING or network loss, replay the same POST/key; there is no GET-by-run-ID operation. Persist
        execution error codes internally; the public Investigation response exposes status, missing_information
        and optional dossier limitations.'
