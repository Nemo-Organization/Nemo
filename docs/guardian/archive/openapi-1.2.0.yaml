            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource missing or outside permitted scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State, balance, acknowledgement, or idempotency conflict
