components:
  securitySchemes:
    actorCookie:
      type: apiKey
      in: cookie
      name: guardian_session
    demoCookie:
      type: apiKey
      in: cookie
      name: guardian_demo
  schemas:
    Actor:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        role:
          type: string
          enum:
          - CUSTOMER
          - OPERATOR
        display_name:
          type: string
      required:
      - id
      - role
      - display_name
    Account:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        display_name:
          type: string
        bank_code:
          type: string
        masked_identifier:
          type: string
        balance_vnd: &id002
          type: integer
          format: int64
          minimum: 0
        reserved_vnd: *id002
        available_vnd: *id002
      required:
      - id
      - display_name
      - bank_code
      - masked_identifier
      - balance_vnd
      - reserved_vnd
      - available_vnd
    Recipient:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        display_name:
          type: string
        bank_code:
          type: string
        masked_identifier:
          type: string
      required:
      - id
      - display_name
      - bank_code
      - masked_identifier
    Bootstrap:
      type: object
      additionalProperties: false
      properties:
        sandbox_id: *id001
        scenario:
          type: string
          enum:
          - MAIN_REFUND
          - FALSE_POSITIVE
          - INSUFFICIENT_EVIDENCE
        expires_at: &id005
          type: string
          format: date-time
        actors:
          type: array
          items:
            $ref: '#/components/schemas/Actor'
        current_actor:
          $ref: '#/components/schemas/Actor'
        controller_csrf_token:
          type: string
        actor_csrf_token:
          type: string
      required:
      - sandbox_id
      - scenario
      - expires_at
      - actors
      - current_actor
      - controller_csrf_token
      - actor_csrf_token
    Me:
      type: object
      additionalProperties: false
      properties:
        sandbox_id: *id001
        actor:
          $ref: '#/components/schemas/Actor'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        actor_csrf_token:
          type: string
      required:
      - sandbox_id
      - actor
      - accounts
      - actor_csrf_token
    Refund:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        order_id: *id001
        account_id: *id001
        amount_vnd: &id003
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
        status:
          type: string
          enum:
          - APPROVED
          - SETTLED
        settled_at: &id004
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - order_id
      - account_id
      - amount_vnd
      - status
      - settled_at
    Order:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        order_reference:
          type: string
        merchant_name:
          type: string
        original_amount_vnd: *id003
        return_fee_vnd:
          type:
          - integer
          - 'null'
          minimum: 0
        fee_source:
          type:
          - string
          - 'null'
        fee_verified_at: *id004
        refund:
          anyOf:
          - $ref: '#/components/schemas/Refund'
          - type: 'null'
      required:
      - id
      - order_reference
      - merchant_name
      - original_amount_vnd
      - return_fee_vnd
      - fee_source
      - fee_verified_at
      - refund
    RiskReason:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - AMOUNT_ABOVE_BASELINE
          - RECIPIENT_WARNING
          - RECIPIENT_HOLD
        message:
          type: string
        restriction_id: &id006
          type:
          - string
          - 'null'
          format: uuid
      required:
      - code
      - message
      - restriction_id
    RiskAssessment:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        transfer_id: *id001
        decision:
          type: string
          enum:
          - ALLOW
          - WARN
          - HOLD
        behavior_signal:
          type: string
          enum:
          - NORMAL
          - ANOMALOUS
          - INSUFFICIENT_HISTORY
        recipient_signal:
          type: string
          enum:
          - NONE
          - WARN
          - HOLD
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/RiskReason'
        policy_version:
          type: string
        assessed_at: *id005
        expires_at: *id005
      required:
      - id
      - transfer_id
      - decision
      - behavior_signal
      - recipient_signal
      - reasons
      - policy_version
      - assessed_at
      - expires_at
    Transfer:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        sender_account_id: *id001
        recipient:
          $ref: '#/components/schemas/Recipient'
        amount_vnd: *id003
        status:
          type: string
          enum:
          - DRAFT
          - RISK_HELD
          - READY
          - SUCCEEDED
          - CANCELED
          - REJECTED
          - EXPIRED
        reserved_amount_vnd: *id002
        expires_at: *id005
        created_at: *id005
        completed_at: *id004
        assessment:
          anyOf:
          - $ref: '#/components/schemas/RiskAssessment'
          - type: 'null'
        review_reason:
          type:
          - string
          - 'null'
        replayed:
          type: boolean
      required:
      - id
      - sender_account_id
      - recipient
      - amount_vnd
      - status
      - reserved_amount_vnd
      - expires_at
      - created_at
      - completed_at
      - assessment
      - review_reason
      - replayed
    Quote:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          enum:
          - IMAGE_TRANSCRIPTION
          - CUSTOMER_TEXT
          - REPORT
        text:
          type: string
        report_id: *id006
      required:
      - source
      - text
      - report_id
    ModelEvidence:
      type: object
      additionalProperties: false
      properties:
        transcription:
          type: string
        requested_action:
          type: string
          enum:
          - PAY_FEE
          - PAY_PURCHASE
          - CONFIRM_TRANSFER
          - SHARE_SECRET
          - CONFIRM_LOGIN
          - OTHER
          - UNKNOWN
          description: Primary request. When a message makes several requests, the primary one follows the precedence
            SHARE_SECRET, CONFIRM_LOGIN, PAY_FEE, CONFIRM_TRANSFER, PAY_PURCHASE, OTHER. Definitions are in evaluation.md.
        additional_actions:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
            - PAY_FEE
            - PAY_PURCHASE
            - CONFIRM_TRANSFER
            - SHARE_SECRET
            - CONFIRM_LOGIN
            - OTHER
          description: Optional additive 1.2 extension. Other concrete requests in the same message, excluding the
            primary requested_action and never UNKNOWN. New implementations emit an empty array when none; FE accepts
            absence in legacy fixtures. Server finding composition and the fixed secret/login warning consider both
            fields.
        claimed_purpose:
          type: string
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/Quote'
        extracted_references:
          type: array
          items:
            type: string
        missing_information:
          type: array
          items:
            type: string
      required:
      - transcription
      - requested_action
      - claimed_purpose
      - quotes
      - extracted_references
      - missing_information
    OfficialFacts:
      type: object
      additionalProperties: false
      properties:
        transfer_amount_vnd:
          type:
          - integer
          - 'null'
          minimum: 0
        direction:
          type: string
          enum:
          - OUTGOING
          - UNKNOWN
        refund_amount_vnd:
          type:
          - integer
          - 'null'
          minimum: 0
        refund_status:
          type: string
          enum:
          - APPROVED
          - SETTLED
          - UNKNOWN
        return_fee_vnd:
          type:
          - integer
          - 'null'
          minimum: 0
        fee_source:
          type:
          - string
          - 'null'
      required:
      - transfer_amount_vnd
      - direction
      - refund_amount_vnd
      - refund_status
      - return_fee_vnd
      - fee_source
    Analysis:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        status:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - FAILED
          - TIMED_OUT
        finding:
          type: string
          enum:
          - MISMATCH
          - CONSISTENT
          - UNCERTAIN
        evidence:
