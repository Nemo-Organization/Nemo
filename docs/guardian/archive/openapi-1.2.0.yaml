openapi: 3.1.0
info:
  title: Guardian API
  version: 1.2.0
  description: 'Nemo contest contract. Synthetic finance; server-authenticated customer/operator roles. Datetimes
    are UTC and money is integer VND. Lists order newest first by timestamp then ID, except recipients by display_name
    then ID. Unknown /api paths return JSON errors. All responses with identity, money or evidence use Cache-Control:
    no-store. Role restrictions in each operation are enforced at the backend. Revision 1.1 adds optional nullable
    source-linked dossier responses for bounded read-only AI investigation. Revision 1.2 adds optional additional_actions
    to ModelEvidence and an optional nullable signal to InvestigationFinding. No chat, streaming or public tool-execution
    endpoint is introduced. AI tools cannot mutate money, restrictions or notices.'
servers:
- url: /api/v1
tags:
- name: Demo
- name: Customer
- name: Operations
paths:
  /health:
    get:
      operationId: getHealth
      tags:
      - Customer
      description: Liveness endpoint. Does not expose environment, credentials or provider details.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Session missing or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Role, CSRF or Origin denied
