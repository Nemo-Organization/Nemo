          - type: 'null'
        official_facts:
          $ref: '#/components/schemas/OfficialFacts'
        evidence_available:
          type: boolean
        error_code:
          type:
          - string
          - 'null'
        replayed:
          type: boolean
        dossier:
          anyOf:
