    InvestigationSource:
      type: object
      additionalProperties: false
      description: Server-issued run-local source handle. A source is scoped/minimized; IMAGE_TRANSCRIPTION remains
        model-derived. Customer projection excludes internal report/trace/access data. IDs and quotes require application
        validation.
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,80}$
        kind:
          type: string
          enum:
          - CUSTOMER_TEXT
          - IMAGE_TRANSCRIPTION
          - TRANSFER
          - ORDER
          - REFUND
          - REPORT
          - TRACE_REFERENCE
          - ACCESS_EVENT
        resource_id:
          type:
          - string
          - 'null'
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 160
        excerpt:
          type: string
          minLength: 1
          maxLength: 1000
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - kind
      - resource_id
      - label
      - excerpt
      - observed_at
    InvestigationFinding:
      type: object
      additionalProperties: false
      description: A retained finding must cite valid sources issued to this run. Unsupported claims are removed
        and warnings recorded. This is not a money/policy command or proof of perpetrator identity. The backend
        derives source_ids after validating private per-claim exact-quote or typed-fact supports; source IDs alone
        do not establish semantic correctness.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 80
        statement:
          type: string
          minLength: 1
          maxLength: 1500
        relation:
          type: string
          enum:
          - SUPPORTS_CONCERN
          - COUNTERS_CONCERN
          - UNRESOLVED
        source_ids:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 80
          minItems: 1
          uniqueItems: true
        signal:
          anyOf:
          - $ref: '#/components/schemas/InvestigationSignal'
          - type: 'null'
          description: Optional additive 1.2 extension. Message-level warning sign explained by this finding, or null
            when the finding is about official/system data. New implementations emit null when no signal applies; FE
            accepts absence in legacy fixtures. A signal never changes the composed finding, transfer state or restriction.
      required:
      - id
      - statement
      - relation
      - source_ids
    InvestigationSignal:
      type: string
      description: Catalog of message-level warning signs. A tagged finding requires a literal quote from permitted
        message/report text; PAYEE_DIFFERS_FROM_SENDER also requires a typed fact from the linked transfer. Absence
        of a signal is not counter-evidence. Definitions are in evaluation.md.
      enum:
      - CLAIMS_OFFICIAL_ROLE
      - URGENCY_PRESSURE
      - OFF_PLATFORM_CHANNEL
      - PAYEE_DIFFERS_FROM_SENDER
      - USES_ORDER_DETAILS
      - DISCOURAGES_VERIFICATION
      - OTHER
    InvestigationActivity:
      type: object
      additionalProperties: false
      description: Sanitized receipt of a completed backend tool operation. No raw arguments, unrestricted logs,
        provider exceptions or internal reasoning. Not a live streamed event.
      properties:
        step:
          type: integer
          minimum: 1
          maximum: 4
        tool:
          type: string
          enum:
          - get_customer_context
          - read_case
          - search_related_reports
          - lookup_reference
          - get_batch_access_events
        status:
          type: string
          enum:
          - SUCCEEDED
          - NOT_FOUND
          - DENIED
          - UNAVAILABLE
        summary:
          type: string
          minLength: 1
          maxLength: 240
      required:
      - step
      - tool
      - status
      - summary
    InvestigationDossier:
      type: object
      additionalProperties: false
      description: Validated bounded evidence investigation. Source IDs are unique per run and every finding resolves
        to allowed sources. Empty findings with explicit uncertainty are valid. Schema validation is not factual
        validation.
      properties:
        version:
          type: string
          const: guardian-dossier-v1
        sources:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/InvestigationSource'
        findings:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/InvestigationFinding'
        activity:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/InvestigationActivity'
        recommended_checks:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 500
        limitations:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 500
        citation_warnings:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 500
      required:
      - version
      - sources
      - findings
      - activity
      - recommended_checks
      - limitations
      - citation_warnings
